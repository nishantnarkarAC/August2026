
<!DOCTYPE html>
<html>
<head>
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="LOGO.png" width="40" height="40" alt="Logo">
            <h2>Nishant Portfolio</h2>
        </div>

        <nav id="main-nav">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
            <a href="index.html#about">About</a>
        </nav>
    </header>

    <main class="page-content">

        <h1>Contact Me</h1>
        <p>You can contact me using the form below.</p>

        <!-- POST sends form data in the request body.
             This is a dummy action; it will not store the data. -->
        <form action="https://example.com/submit"
              method="post" class="contact-form">

            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="date">Preferred Contact Date:</label>
            <input type="date" id="date" name="date" required>

            <label for="enquiry">Enquiry Type:</label>
            <select id="enquiry" name="enquiry" required>
                <option value="">Select an enquiry</option>
                <option value="job">Job Opportunity</option>
                <option value="project">Project Discussion</option>
                <option value="general">General Enquiry</option>
            </select>

            <p>Preferred Contact Mode:</p>

            <input type="radio" id="email-mode"
                   name="contact_mode" value="email" required>
            <label for="email-mode">Email</label>

            <input type="radio" id="phone-mode"
                   name="contact_mode" value="phone">
            <label for="phone-mode">Phone</label>

            <input type="radio" id="message-mode"
                   name="contact_mode" value="message">
            <label for="message-mode">Message</label>

            <br><br>

            <label for="message">Your Message:</label>
            <textarea id="message" name="message"
                      rows="5" placeholder="Write your message"
                      required></textarea>

            <label for="cv">Upload CV:</label>
            <input type="file" id="cv" name="cv"
                   accept=".pdf,.doc,.docx">

            <br><br>

            <input type="checkbox" id="consent"
                   name="consent" value="yes" required>
            <label for="consent">
                I agree to be contacted about my enquiry.
            </label>

            <br><br>

            <button type="submit">Submit</button>
            <button type="reset" class="reset-btn">Reset</button>

        </form>

        <h2>My City</h2>

        <iframe
            src="https://www.google.com/maps?q=Nanded,Maharashtra&output=embed"
            width="100%" height="300"
            title="Map of Nanded, Maharashtra">
        </iframe>

        <p><a href="index.html">Back to Home</a></p>

    </main>

</body>
</html>
